[package]
name = "var_quantity"
version = "0.6.0"
edition = "2024"
description = "Provides an interface for defining variable quantities whose value depends on that of other quantities."
readme = "README.md"
license  = "MIT OR Apache-2.0"
repository = "https://github.com/StefanMathis/var_quantity.git"

[dependencies]
horner = "0.1.2"
serde = { version = "1", features = ["derive"], optional = true }
deserialize_untagged_verbose_error = {version = "0.1.8", optional = true }
typetag = { version = "^0.2", optional = true }
serde-value = { version = "0.7", optional = true }
dyn_quantity = { version = "0.6.2", features = ["uom"] }
dyn-clone = "1"
smallvec = "1"
num = {version = "0.4"}

[features]
default = []
serde = ["dep:serde", "dep:typetag", "dep:serde-value", "dep:deserialize_untagged_verbose_error", "dyn_quantity/serde"]
from_str = ["dyn_quantity/from_str"]

[dev-dependencies]
yaml_serde = "0.10.6"
approxim = { version = "0.6" }
indoc = "1.0"
var_quantity = { path = ".", features = ["from_str", "serde"] }

[package.metadata.docs.rs]
features = ["serde", "from_str"]
